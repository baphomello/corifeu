name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Implemented inline rather than with a third-party action: this gate runs on
      # every contribution, so it should not be a supply-chain dependency.
      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          fmt = "%H%x1f%an%x1f%ae%x1f%P%x1f%B%x1e"
          out = subprocess.run(
              ["git", "log", f"{base}..{head}", f"--format={fmt}"],
              capture_output=True, text=True, check=True).stdout

          failures = []
          checked = 0
          for record in out.split("\x1e"):
              if not record.strip():
                  continue
              sha, name, email, parents, body = record.lstrip("\n").split("\x1f", 4)
              if len(parents.split()) > 1:
                  continue  # merge commits carry no authorship of their own
              checked += 1
              want = f"Signed-off-by: {name} <{email}>"
              signoffs = re.findall(r"^Signed-off-by: .+$", body, re.MULTILINE)
              if want not in signoffs:
                  subject = body.strip().splitlines()[0] if body.strip() else "(no subject)"
                  failures.append((sha[:8], subject, want, signoffs))

          if failures:
              print(f"::error::{len(failures)} of {checked} commit(s) are not signed off\n")
              for sha, subject, want, found in failures:
                  print(f"  {sha}  {subject}")
                  print(f"    expected: {want}")
                  print(f"    found:    {found or 'nothing'}\n")
              print("Fix the whole branch with:\n")
              print("    git rebase --signoff origin/" + os.environ.get("GITHUB_BASE_REF", "main"))
              print("    git push --force-with-lease\n")
              print("See CONTRIBUTING.md. Corifeu uses the DCO and will never use a CLA.")
              sys.exit(1)

          print(f"All {checked} commit(s) signed off.")
          PY
