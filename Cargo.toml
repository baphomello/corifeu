[workspace]
resolver = "3"
members = ["crates/*", "bench"]
# The measurement fixtures are crates a round edits, not crates this workspace
# builds. They are built by the round, inside the round's own directory.
exclude = ["bench/tasks", "bench/rounds"]

# Shared across every crate so metadata cannot drift between them.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
repository = "https://github.com/baphomello/corifeu"
homepage = "https://github.com/baphomello/corifeu"
authors = ["Vinicius Mello <baphomello@gmail.com>"]

[workspace.dependencies]
clap = { version = "4.5.23", features = ["derive"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
# ADR-0040: chosen over the serde_yaml forks on error-message quality.
serde-saphyr = "1.3.0"
# Gives the field path of a deserialization failure, so an error can name the
# layer that contributed the offending value.
serde_path_to_error = "0.1.16"
thiserror = "2.0.9"
corifeu-config = { path = "crates/corifeu-config", version = "0.0.0" }
corifeu-check = { path = "crates/corifeu-check", version = "0.0.0" }
corifeu-exec = { path = "crates/corifeu-exec", version = "0.0.0" }
corifeu-agent = { path = "crates/corifeu-agent", version = "0.0.0" }
corifeu-workspace = { path = "crates/corifeu-workspace", version = "0.0.0" }
corifeu-ollama = { path = "crates/corifeu-ollama", version = "0.0.0" }
corifeu-provider = { path = "crates/corifeu-provider", version = "0.0.0" }
corifeu-llamacpp = { path = "crates/corifeu-llamacpp", version = "0.0.0" }
corifeu-cliagent = { path = "crates/corifeu-cliagent", version = "0.0.0" }
corifeu-doer = { path = "crates/corifeu-doer", version = "0.0.0" }
corifeu-planner = { path = "crates/corifeu-planner", version = "0.0.0" }
corifeu-bench = { path = "bench", version = "0.0.0" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
